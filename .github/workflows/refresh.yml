name: refresh-data

# Checks weekly for a new Ember file and refreshes the Neon database.
# Fails (red) if the pipeline or any hard quality check fails.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Refresh data on Neon (quality gate inside)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python run.py refresh --target neon
